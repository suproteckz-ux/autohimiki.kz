# ════════════════════════════════════════════════════════════════
# Supervisor конфигурации для autohimiki.kz
# Файл: /etc/supervisor/conf.d/autohimiki.conf
# После изменений: supervisorctl reread && supervisorctl update
# ════════════════════════════════════════════════════════════════

# ── Queue Worker: обычные задачи ──────────────────────────────
[program:autohimiki-worker]
command=php /var/www/autohimiki.kz/artisan queue:work database
    --queue=imports-high,imports,imports-low,default
    --sleep=3
    --tries=3
    --timeout=120
    --max-time=3600
    --max-jobs=1000
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/autohimiki.kz
user=www-data
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/var/log/supervisor/autohimiki-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/autohimiki-worker-error.log

# ── Scheduler: cron-задачи Laravel ───────────────────────────
[program:autohimiki-scheduler]
command=php /var/www/autohimiki.kz/artisan schedule:work
process_name=%(program_name)s
numprocs=1
directory=/var/www/autohimiki.kz
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/autohimiki-scheduler.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/autohimiki-scheduler-error.log
